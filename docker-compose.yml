services:
  api:
    build: .
    container_name: lima-clm

    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - .:/app

    working_dir: /app

    depends_on:
      - postgres

    env_file:
      - .env.development

    environment:
      APP_ENV: development

  postgres:
    image: postgres:17.6
    container_name: postgres-db

    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: