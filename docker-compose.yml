version: "3.9"

services:
  api:
    build: .
    container_name: lima-clm

    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - .:/app

    working_dir: /app

    depends_on:
      - postgres

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: appdb

  postgres:
    image: postgres:17.6
    container_name: postgres-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: